<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 | Justin Liu</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 背景动画 -->
    <div class="bg-animation">
        <div class="grid-lines"></div>
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-bracket">{</span>
                <span class="logo-text">Justin</span>
                <span class="logo-bracket">}</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" data-i18n="nav.home">首页</a></li>
                <li><a href="blog.html" class="active" data-i18n="nav.blog">博客</a></li>
                <li><a href="cv.html" data-i18n="nav.cv">简历</a></li>
            </ul>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                    <span class="icon-sun">☀️</span>
                    <span class="icon-moon">🌙</span>
                </button>
                <button class="lang-toggle" id="langToggle">
                    <span class="lang-zh">中</span>
                    <span class="lang-divider">/</span>
                    <span class="lang-en">EN</span>
                </button>
                <button class="menu-toggle" id="menuToggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="main-content">
        <!-- 页面头部 -->
        <header class="page-header">
            <h1 class="page-title" data-i18n="blog.title">博客</h1>
            <p class="page-subtitle" data-i18n="blog.subtitle">分享技术见解与学习心得</p>
        </header>

        <!-- 分类筛选 -->
        <div class="blog-container">
            <div class="blog-filters">
                <button class="filter-btn active" data-filter="all">
                    <span class="filter-icon">📚</span>
                    <span class="filter-text" data-i18n="blog.filter.all">全部</span>
                </button>
                <button class="filter-btn" data-filter="tech">
                    <span class="filter-icon">💻</span>
                    <span class="filter-text" data-i18n="blog.filter.tech">技术</span>
                </button>
                <button class="filter-btn" data-filter="life">
                    <span class="filter-icon">🌟</span>
                    <span class="filter-text" data-i18n="blog.filter.life">生活</span>
                </button>
            </div>

            <!-- 博客列表 -->
            <div class="blog-list">
                <!-- 博客文章将通过 JavaScript 动态加载 -->
                <div class="blog-empty">
                    <div class="blog-empty-icon">⏳</div>
                    <h3>加载中...</h3>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <p>© 2025 Justin Liu. <span data-i18n="footer.rights">保留所有权利</span></p>
            <p class="footer-tech" data-i18n="footer.tech">使用 HTML, CSS & JavaScript 构建</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
