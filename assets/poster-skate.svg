<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title">
  <title id="title">Abstract skate poster with a board and ramp in charcoal and cream</title>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.15"/>
      </feComponentTransfer>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#171411"/>
    </pattern>
    <clipPath id="moon">
      <circle cx="420" cy="380" r="256"/>
    </clipPath>
  </defs>

  <rect width="800" height="1000" fill="#191612"/>
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#e9e0cf" stroke-width="1.5"/>

  <circle cx="420" cy="380" r="256" fill="#e9e0cf"/>
  <g clip-path="url(#moon)" opacity=".3">
    <rect x="150" y="110" width="540" height="540" fill="url(#dots)"/>
  </g>

  <path d="M76 748 Q 400 512 724 748" fill="none" stroke="#e9e0cf" stroke-width="2"/>
  <path d="M76 784 Q 400 548 724 784" fill="none" stroke="#e9e0cf" stroke-width="1" opacity=".45"/>

  <g transform="rotate(-13 400 646)">
    <rect x="206" y="596" width="388" height="92" rx="44" fill="#b54327"/>
    <rect x="226" y="614" width="348" height="10" rx="5" fill="#e9e0cf" opacity=".55"/>
    <circle cx="286" cy="704" r="26" fill="#e9e0cf"/>
    <circle cx="514" cy="704" r="26" fill="#e9e0cf"/>
  </g>

  <text x="76" y="110" fill="#e9e0cf" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14" letter-spacing="3">FIELD NOTES / 02</text>
  <text x="724" y="110" fill="#e9e0cf" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14" letter-spacing="3" text-anchor="end">SKATE</text>

  <text x="76" y="840" fill="#e9e0cf" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" letter-spacing="-5">OLLIE</text>
  <text x="76" y="930" fill="#b54327" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-style="italic" letter-spacing="-3">kickflip.</text>

  <text transform="translate(754 450) rotate(90)" fill="#e9e0cf" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" letter-spacing="4">PRACTICE / FALL / REPEAT</text>

  <g stroke="#e9e0cf" stroke-width="1">
    <line x1="724" y1="148" x2="738" y2="148"/>
    <line x1="731" y1="141" x2="731" y2="155"/>
  </g>

  <rect width="800" height="1000" filter="url(#grain)" opacity=".5"/>
</svg>
